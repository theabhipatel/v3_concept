[project]
name = "abi-agent"
version = "0.1.0"
description = "ABI (Abhi's Brain Interface) - the agent backend for the TheAbhiPatel portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.54.0",
]
